# Example reverse proxy for the Node server (node dist/server/entry.mjs on :4321).
server {
  listen 443 ssl http2;
  server_name www.thebrandmediamarketing.com;
  # ssl_certificate / ssl_certificate_key — configure with your certificate (e.g. certbot)

  gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

  location /_astro/ {
    proxy_pass http://127.0.0.1:4321;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /api/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server { listen 80; server_name thebrandmediamarketing.com www.thebrandmediamarketing.com; return 301 https://www.thebrandmediamarketing.com$request_uri; }
