# Decap CMS configuration — every content collection is editable without code.
# Role-based access: repository permissions (GitHub) control who can log in; editorial_workflow
# requires changes to be reviewed and merged before they go live.
# Authentication: GitHub backend needs an OAuth provider (e.g. Decap/Netlify OAuth or a self-hosted
# OAuth proxy). Set `backend.base_url` to that proxy URL before first use. See docs/CMS.md.
backend:
  name: github
  repo: vipinjanu77-max/the-brand-media-marketing
  branch: main
publish_mode: editorial_workflow
site_url: https://www.thebrandmediamarketing.com
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
- name: settings
  label: Site settings
  files:
  - label: Global settings
    name: site
    file: src/data/settings.json
    fields:
    - label: Name
      name: name
      widget: string
    - label: Short name
      name: shortName
      widget: string
    - label: Legal name
      name: legalName
      widget: string
    - label: Tagline
      name: tagline
      widget: string
    - label: Positioning
      name: positioning
      widget: string
    - label: Description (entity description — keep consistent everywhere)
      name: description
      widget: text
    - label: Founding year
      name: foundingYear
      widget: string
      required: false
    - label: Founder
      name: founder
      widget: string
      required: false
    - label: Email
      name: email
      widget: string
      required: false
    - label: Phone
      name: phone
      widget: string
      required: false
    - label: WhatsApp number
      name: whatsapp
      widget: string
      required: false
    - label: Address
      name: address
      widget: object
      fields:
      - label: Street
        name: street
        widget: string
        required: false
      - label: City
        name: city
        widget: string
        required: false
      - label: Region
        name: region
        widget: string
        required: false
      - label: Postal code
        name: postalCode
        widget: string
        required: false
      - label: Country
        name: country
        widget: string
    - label: Areas served
      name: areaServed
      widget: list
    - label: Booking URL (Calendly / Google Calendar etc.)
      name: bookingUrl
      widget: string
      required: false
    - label: Social profiles
      name: social
      widget: object
      fields:
      - label: linkedin
        name: linkedin
        widget: string
        required: false
      - label: instagram
        name: instagram
        widget: string
        required: false
      - label: youtube
        name: youtube
        widget: string
        required: false
      - label: x
        name: x
        widget: string
        required: false
      - label: facebook
        name: facebook
        widget: string
        required: false
      - label: googleBusinessProfile
        name: googleBusinessProfile
        widget: string
        required: false
    - label: Analytics (public IDs only — never secrets)
