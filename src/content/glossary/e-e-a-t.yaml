term: E-E-A-T
definition: E-E-A-T stands for Experience, Expertise, Authoritativeness and Trustworthiness, concepts from Google's
  Search Quality Rater Guidelines used to describe what makes content credible.
explanation: 'E-E-A-T is not a single ranking factor or score. It describes qualities Google''s systems aim to reward:
  first-hand experience, genuine expertise, recognised authority and, above all, trust.'
