term: TOFU (Top of Funnel)
abbreviation: TOFU
definition: Top of funnel (TOFU) describes people becoming aware of a problem or category, and the content aimed
  at them — educational articles, research, social content.
explanation: TOFU builds awareness and audiences for later remarketing; judge it on reach and engagement quality,
  not immediate sales.
