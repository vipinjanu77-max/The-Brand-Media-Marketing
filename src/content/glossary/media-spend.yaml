term: Media Spend
definition: Media spend is money paid directly to advertising platforms or publishers for ad placements, separate
  from agency fees, creative production and technology costs.
explanation: Separating media from fees makes marketing costs transparent. TBM recommends clients own ad accounts
  and pay platforms directly.
