term: BOFU (Bottom of Funnel)
abbreviation: BOFU
definition: 'Bottom of funnel (BOFU) describes buyers close to a decision and the content or campaigns aimed at
  converting them: pricing, demos, proposals, comparisons and case studies.'
explanation: BOFU content answers 'why you, why now, and what will it cost?'. It usually has lower traffic but the
  highest conversion value.
