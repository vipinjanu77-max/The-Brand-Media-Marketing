term: SQL (Sales Qualified Lead)
abbreviation: SQL
definition: A sales qualified lead (SQL) is a lead that sales has reviewed and accepted as a genuine opportunity
  worth active pursuit.
explanation: The MQL-to-SQL rate is one of the most honest measures of marketing lead quality.
