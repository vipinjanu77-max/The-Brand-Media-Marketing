term: Entity
definition: In search, an entity is a distinct, identifiable thing — a company, person, place, product or concept
  — that search engines and AI systems can recognise and connect to facts.
explanation: Consistent entity information (name, description, location, founders, services) across your site and
  the web helps search engines and answer engines describe your business accurately.
