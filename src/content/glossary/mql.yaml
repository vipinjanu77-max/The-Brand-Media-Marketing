term: MQL (Marketing Qualified Lead)
abbreviation: MQL
definition: A marketing qualified lead (MQL) is a lead that meets agreed fit and engagement criteria indicating
  it is worth passing to sales.
explanation: MQL definitions only work when written down and agreed with sales. Otherwise 'lead quality' becomes
  an argument instead of a metric.
