term: GA4 (Google Analytics 4)
abbreviation: GA4
definition: Google Analytics 4 (GA4) is Google's event-based analytics platform for websites and apps.
explanation: GA4 measures everything as events, supports cross-device journeys and integrates with Google Ads. Its
  value depends on a well-designed measurement plan and consent-aware implementation.
