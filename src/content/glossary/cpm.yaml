term: CPM (Cost per Mille)
abbreviation: CPM
definition: CPM is the cost of 1,000 ad impressions.
explanation: CPM reflects audience competition and ad quality on auction-based platforms. It is the starting point
  for estimating reach-based campaigns.
formula: CPM = Spend / Impressions x 1,000
