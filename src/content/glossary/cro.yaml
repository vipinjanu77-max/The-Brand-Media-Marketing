term: CRO (Conversion Rate Optimisation)
abbreviation: CRO
definition: Conversion rate optimisation (CRO) is the structured process of increasing the percentage of visitors
  who take a desired action through research, hypotheses and testing.
explanation: CRO starts with understanding why people don't convert — analytics, recordings, surveys, sales feedback
  — before changing anything.
