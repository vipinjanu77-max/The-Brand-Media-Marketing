topic: Pricing & contracts
order: 2
items:
- q: How much does digital marketing cost in India?
  a: It depends on channels, scope, market and scale. Agency fees, media spend, creative production and technology
    should be evaluated separately. Our cost guide and cost calculator explain the components.
- q: Is media spend included in your fee?
  a: No. Media spend is paid directly to platforms from accounts you own. Our fees, creative production and any
    tools are shown separately.
- q: Is there a minimum commitment?
  a: Commitments are set out clearly in each proposal. See our contract transparency page for how we approach minimum
    terms, notice periods and termination.
