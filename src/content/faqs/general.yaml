topic: About TBM
order: 1
items:
- q: What does a digital marketing agency do?
  a: 'A digital marketing agency plans and runs the online activities that help a business acquire and keep customers:
    strategy, paid advertising, SEO, content, social media, creative, websites, analytics and automation. At TBM,
    we connect those activities into one measurable growth system rather than selling them as separate services.'
- q: Who does TBM work with?
  a: Businesses that want measurable growth (from founders and SMEs to enterprise marketing teams) across real estate,
    D2C, e-commerce, B2B, SaaS, education, healthcare and other sectors.
- q: Do you guarantee results?
  a: No. Marketing outcomes depend on your product, pricing, market, competition and sales process. We commit to
    a clear process, honest targets and transparent reporting.
- q: Who owns the ad accounts and data?
  a: You do. We work in accounts owned by your business, and your data, creative and reporting remain yours.
