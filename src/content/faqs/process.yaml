topic: Working with TBM
order: 3
items:
- q: What happens after we sign?
  a: Week 1 discovery, week 2 audit, week 3 strategy, week 4 build, then testing in month 2, optimisation in month
    3 and scaling from month 4. See our onboarding page for detail.
- q: How do you report?
  a: Weekly performance notes and a monthly business review covering spend, leads, qualified leads, CAC, revenue
    and what we are changing next. See the reporting demo.
- q: How quickly can we start?
  a: Typically within one to two weeks of agreeing scope, depending on access to accounts and data.
