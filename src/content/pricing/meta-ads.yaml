title: Meta Ads
order: 3
service: meta-ads
intro: 'Three costs, shown separately: management, creative production and media spend.'
tiers:
- name: Management
  priceFrom: 30000
  priceTo: 125000
  unit: per month — or 12–15% of spend above ₹5 lakh/month
  bestFor: Ongoing campaign management
  includes:
  - Campaign structure and audiences
  - Conversions API setup
  - Creative testing roadmap
  - Lead-quality feedback loop
  - Reporting
  excludes:
  - Media spend
  - Creative production
- name: Creative production
  priceFrom: 25000
  priceTo: 100000
  unit: per month (8–20 assets)
  bestFor: Brands needing a steady creative pipeline
  includes:
  - Static and carousel ads
  - Short-form video / Reels edits
  - Copy variants
  excludes:
  - Shoots, talent and UGC creator fees
- name: Minimum recommended media budget
  priceFrom: 75000
  priceTo: null
  unit: per month, paid to Meta
  bestFor: Enough volume to test creative properly
  includes:
  - Billed directly by Meta to your account
  excludes: []
notes:
- Indicative starting prices in INR, excluding GST. Final pricing depends on scope, market, competition, complexity
  and required resources.
- Media spend, production and third-party tools are billed separately and transparently.
