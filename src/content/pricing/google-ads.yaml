title: Google Ads
order: 2
service: google-ads
intro: Management fee is separate from media spend. You pay Google directly from an account you own.
tiers:
- name: Setup
  priceFrom: 25000
  priceTo: 60000
  unit: one-time
  bestFor: New accounts or full rebuilds
  includes:
  - Account audit
  - Conversion tracking (GA4, enhanced conversions)
  - Campaign architecture
  - Ad copy and assets
  excludes: []
- name: Management fee
  priceFrom: 30000
  priceTo: 150000
  unit: per month, or 12-15% of spend above ₹5 lakh/month
  bestFor: Ongoing optimisation
  includes:
  - Bid and budget management
  - Weekly search-term reviews
  - Ad and landing page testing
  - Monthly report and review call
  excludes:
  - Media spend
  - Landing page development
- name: Minimum recommended media budget
  priceFrom: 100000
  priceTo: null
  unit: per month, paid to Google
  bestFor: Enough conversions for bidding to learn
  includes:
  - Final recommendation set per market and objective during scoping
  excludes: []
notes:
- Indicative starting prices in INR, excluding GST. Final pricing depends on scope, market, competition, complexity
  and required resources.
- Media spend, production and third-party tools are billed separately and transparently.
